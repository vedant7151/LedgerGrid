server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounts_db}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
  flyway:
    enabled: true
    # Lets an existing pre-Flyway dev database (schema already created by Hibernate) be adopted as V1
    # instead of failing on 'relation already exists'. A fresh/empty database simply runs V1.
    baseline-on-migrate: true
  jpa:
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only validates it (Phase 9).
      ddl-auto: validate
    show-sql: true
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # 'redis' in Docker
      port: ${REDIS_PORT:6379}
jwt:
  # Shared HMAC secret — must match the same env var across all three services.
  # Set JWT_SECRET in production; default is a demo-only value, never commit a real secret.
  secret: ${JWT_SECRET:ledgergrid-demo-secret-change-me-in-production-must-be-32chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
